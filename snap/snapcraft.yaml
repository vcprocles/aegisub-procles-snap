name: aegisub-procles
base: core24
version: 3.4.2-snap3
summary: Advanced subtitle editor
description: |
 Originally created as tool to make typesetting, particularly in anime
 fansubs, a less painful experience, Aegisub has grown into a fully
 fledged, highly customizable subtitle editor.

 It features a lot of convenient tools to help you with timing,
 typesetting, editing and translating subtitles, as well as a powerful
 scripting environment called Automation (originally mostly intended for
 creating karaoke effects, Automation can now be used much else, including
 creating macros and various other convenient tools).

 This is an unofficial snap, the developers may not be responsible for any bugs in it. For any bug reports: https://github.com/vcprocles/aegisub-procles-snap
grade: stable
confinement: strict
#compression: lzo
platforms:
  amd64:
  arm64:

parts:
  wxwidgets:
    plugin: cmake
    source-type: git
    source: https://github.com/wxWidgets/wxWidgets.git
    source-tag: v3.2.10 
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_BUILD_TYPE=Release
      - -DwxBUILD_TOOLKIT=gtk3
      - -DwxUSE_OPENGL=ON
      - -DwxUSE_GLCANVAS_EGL=ON
      - -DwxUSE_NANOSVG=OFF
      - -DwxBUILD_SHARED=ON
    build-packages:
      - libgtk-3-dev
      - libgl-dev
      - libegl1-mesa-dev
      - libwayland-dev
      - libx11-dev
      - cmake
      - ninja-build
    override-build: |
      craftctl default
      #fix symlinks and wxconfig
      cd "$CRAFT_PART_INSTALL/usr/bin"
      rm -f wx-config wxrc
      ln -s "../lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/wx/config/gtk3-unicode-3.2" wx-config
      ln -s wxrc-3.2 wxrc
      WX_CONF_SCRIPT="$CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/wx/config/gtk3-unicode-3.2"
      if [ -f "$WX_CONF_SCRIPT" ]; then
        sed -i "s|^prefix=.*|prefix=\"$CRAFT_STAGE/usr\"|g" "$WX_CONF_SCRIPT"
        sed -i "s|^exec_prefix=.*|exec_prefix=\"$CRAFT_STAGE/usr\"|g" "$WX_CONF_SCRIPT"
      fi
    prime:
      - -usr/bin/wx-config
      - -usr/bin/wxrc

  aegisub-procles:
    after: [wxwidgets]
    plugin: meson
    build-environment:
      - PATH: "$CRAFT_STAGE/usr/bin:$PATH"
      - PKG_CONFIG_PATH: "$CRAFT_STAGE/usr/lib/pkgconfig:$CRAFT_STAGE/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pkgconfig:$PKG_CONFIG_PATH"
      - WX_CONFIG: "$CRAFT_STAGE/usr/bin/wx-config"
    meson-parameters:
      - --prefix=/usr
      - --buildtype=release
      - --strip
      - -Denable_update_checker=false
      - -Dsystem_luajit=false
    source-type: git
    source: https://github.com/TypesettingTools/Aegisub
    source-tag: v3.4.2
    override-pull: |
      craftctl default
      meson subprojects download luajit
      meson subprojects packagefiles --apply luajit
      #fix version reporting in about box etc.
      VERSION_SCRIPT="$(find . -name version.sh | head -n 1)"
      if [ -n "$VERSION_SCRIPT" ]; then
        cat << 'EOF' > "$VERSION_SCRIPT"
      #!/bin/sh
      builddir="$1"
      version_h_path="${builddir}/git_version.h"
      cat << 'HDR' > "${version_h_path}"
      #define BUILD_GIT_VERSION_NUMBER 0
      #define BUILD_GIT_VERSION_STRING "3.4.2"
      #define TAGGED_RELEASE 1
      #define INSTALLER_VERSION "3.4.2"
      #define RESOURCE_BASE_VERSION 3, 4, 2
      HDR
      exit 0
      EOF
        chmod +x "$VERSION_SCRIPT"
      fi
    override-prime: |
      craftctl default
      sed -i 's@org.aegisub.Aegisub@/usr/share/icons/hicolor/scalable/apps/org.aegisub.Aegisub.svg@g' "$CRAFT_PRIME/usr/share/applications/org.aegisub.Aegisub.desktop"
    build-packages:
      - libgl-dev
      - libfreetype-dev
      - libfontconfig1-dev
      - libass-dev
      - libboost-dev
      - libboost-chrono-dev
      - libboost-filesystem-dev
      - libboost-locale-dev
      - libboost-regex-dev
      - libboost-system-dev
      - libboost-thread-dev
      - libffms2-dev
      - intltool
      - libhunspell-dev
      - libfftw3-dev
      - libuchardet-dev
      - libpulse-dev
      - libicu-dev
      - autopoint
    stage-packages:
      - libass9
      - libboost-chrono1.83.0
      - libboost-filesystem1.83.0
      - libboost-locale1.83.0
      - libboost-regex1.83.0
      - libboost-thread1.83.0
      - libffms2-5
      - libfftw3-double3
      - libfontconfig1
      - libgl1
      - libhunspell-1.7-0
      - libicu74
      - libpulse0
      - libsndio7.0
      - libuchardet0
      #for downloading depcontrol
      - curl
      - wget
      - unzip
      #for depcontrol itself
      - binutils
      - luajit

  # move-scripts:
  #   plugin: dump
  #   source: .
  #   organize:
  #     move_scripts.sh: bin/
      
  install-depcontrol:
    plugin: dump
    source: .
    organize:
      install_depcontrol.sh: bin/

apps:
  aegisub-procles:
    extensions: [gnome]
    environment:
      LD_LIBRARY_PATH: $LD_LIBRARY_PATH:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pulseaudio/
      #dependencycontrol needs this
      LUA_PATH: "$SNAP_USER_DATA/.aegisub/automation/include/?.lua;$SNAP_USER_DATA/.aegisub/automation/include/?/init.lua;$SNAP/usr/share/aegisub/automation/include/?.lua;$SNAP/usr/share/aegisub/automation/include/?/init.lua;;"
      LUA_CPATH: "$SNAP_USER_DATA/.aegisub/automation/include/?.so;$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/lua/5.1/?.so;;"
    command: usr/bin/aegisub
    desktop: usr/share/applications/org.aegisub.Aegisub.desktop
    common-id: aegisub.desktop
    plugs:
      - audio-playback
      - home
      - opengl
      - removable-media
      - network #for dependencycontrol
  # move-scripts:
  #   command: bin/move_scripts.sh
  setup-automation:
    command: bin/install_depcontrol.sh